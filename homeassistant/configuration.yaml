default_config:

homeassistant:
  internal_url: "http://192.168.0.157:18123"
  external_url: "http://192.168.0.157:18123"

tts:
  - platform: google_translate

rest_command:
  ai_operator_assistant:
    url: "http://backend:3000/assistant"
    method: post
    headers:
      content-type: "application/json"
      x-api-key: !secret backend_api_key
    timeout: 120
    payload: >
      {
        "query": "{{ query }}",
        "conversationId": "{{ conversation_id | default('homeassistant') }}"
      }

automation: !include automations.yaml
script: !include scripts.yaml
